<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="mask-icon" href="/masked-icon.svg" color="#4f46e5">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5">
    <title>Sourdough Calculator</title>

    <!-- Fonts for the Futuristic and 80s colour themes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Jost:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Apply the saved colour theme and light/dark choice before first paint so neither flashes
      try {
        var root = document.documentElement;
        var t = localStorage.getItem('colorTheme');
        if (t === 'futuristic' || t === 'eighties') root.dataset.theme = t;
        var mode = localStorage.getItem('theme');
        var dark = mode ? mode === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) root.classList.add('dark');
      } catch (e) {}
    </script>

    <!-- OpenGraph tags -->
    <meta property="og:title" content="Sourdough Calculator" />
    <meta property="og:description" content="Calculate perfect sourdough recipes with custom hydration, salt percentage, and multiple flour types." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.abaum.net/sourdough-calculator/" />
    <meta property="og:image" content="https://www.abaum.net/sourdough-calculator/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="Sourdough Calculator" />

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sourdough Calculator" />
    <meta name="twitter:description" content="Calculate perfect sourdough recipes with custom hydration, salt percentage, and multiple flour types." />
    <meta name="twitter:image" content="https://www.abaum.net/sourdough-calculator/pwa-512x512.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.abaum.net/sourdough-calculator/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
